<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <p>Redirecting to the new documentation site…</p>

  <script>
    const cloudflareSite = "https://cerg-docs.pages.dev";
    const githubRepoPath = "/CERG-Website-Documentation";

    // Remove the GitHub Pages repository prefix.
    let path = window.location.pathname;

    if (path.startsWith(githubRepoPath)) {
      path = path.slice(githubRepoPath.length);
    }

    // Preserve query parameters and fragments.
    const destination =
      cloudflareSite +
      (path || "/") +
      window.location.search +
      window.location.hash;

    window.location.replace(destination);
  </script>
</body>
</html>
