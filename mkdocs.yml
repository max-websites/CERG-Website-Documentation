site_name: CERG Website Documentation
site_description: How-to guides for editing the website
site_url: https://maxnielsen.ca/cerg

theme:
  name: material
  logo: img/CERG_logo_square_background.svg
  favicon: img/favicon.ico
  palette:
    # Light mode — SFU Light Red primary, SFU Dark Red accent
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red        # placeholder; overridden by extra.css below
      accent: red          # placeholder; overridden by extra.css below
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode — same brand reds, dark background
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.sections
    - navigation.tabs
    - navigation.expand
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.path
    - toc.follow
    - toc.integrate 
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips

nav:
  - Home: index.md
  - General:
      - "Design Guidelines": general/design-guidelines.md
      - "Update info on a page": general/update-info-on-a-page.md
      - "Copy an existing component/design": general/copy-an-existing-component-design.md
      - "About Tags": general/about-tags.md
      - "About Page Properties": general/about-page-properties.md
      - "About HTML code": general/about-html-code.md
      - "About Lists": general/about-lists.md
      - "About page templates": general/about-page-templates.md
  - New Content:
      - "Applying a Working Paper Template": new-content/applying-a-working-paper-template.md
      - "Adding a Working Paper": new-content/adding-a-working-paper.md
      - "Uploading new photos and documents": new-content/how-to-upload-new-photos-and-documents.md
      - "How to add a new Op-ed": new-content/how-to-add-a-new-op-ed.md
      - "How to add an event": new-content/how-to-add-an-event.md
      - "How to add a news item": new-content/how-to-add-a-news-item.md
      - "How to add a team member": new-content/how-to-add-a-team-member.md
  - Changing Content:
      - "Updating the homepage": changing-content/updating-the-homepage.md
      - "Updating the agrivoltaics page": changing-content/updating-the-agrivoltaics-page.md
      - "YouTube video feeds": changing-content/yt-video-feeds.md
      - "Archive a team member": changing-content/archive-a-team-member.md
  - Analytics:
      - "Analyze page views": analytics/how-to-see-page-views.md
      - "View downloads of Working Papers": analytics/how-to-see-downloads-of-working-papers.md
      - "View links clicked": analytics/how-to-see-links-clicked.md
      - "How to set up link tracking": analytics/how-to-set-up-link-tracking.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list
  - pymdownx.blocks.caption
  - pymdownx.snippets
  - abbr
  - md_in_html
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - toc:
      toc_depth: 2

plugins:
  - mkdocs-video
  - search:
      enabled: true
  - glightbox:
      skip_classes:
          - skip-lightbox

extra_css:
  - css/extra.css